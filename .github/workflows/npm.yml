name: npm

# Builds and tests both npm packages on every push and pull request to main;
# a tag vX.Y.Z also publishes them. Publishing goes through npm trusted
# publishing (OIDC): no token in the repository, but each package on npmjs.com
# has to name this repository and this workflow file as its trusted publisher.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [full, reader]
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          # Pinned: a new wasm-pack must not break the build with no change here.
          tool: wasm-pack@0.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache the build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ matrix.package }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-${{ matrix.package }}-

      - name: Build
        run: |
          if [ "${{ matrix.package }}" = full ]; then ./build-npm.sh; else ./build-npm-reader.sh; fi

      - name: The size of the wasm
        run: |
          dir=$([ "${{ matrix.package }}" = full ] && echo npm || echo npm-reader)
          for f in $dir/pkg/*.wasm; do
            echo "${{ matrix.package }}: $(stat -c %s "$f") bytes, $(gzip -9c "$f" | wc -c) gzipped" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Test the full package
        if: matrix.package == 'full'
        working-directory: npm
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Test the reader package
        if: matrix.package == 'reader'
        working-directory: npm-reader
        run: |
          npm ci
          npm test

      - name: Pack under the scope
        run: ./pack-npm.sh ${{ matrix.package }}

      - name: The tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dir=$([ "${{ matrix.package }}" = full ] && echo npm || echo npm-reader)
          version=$(node -p "require('./$dir/pkg-publish/package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, package $version" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.package }}
          path: ${{ matrix.package == 'full' && 'npm' || 'npm-reader' }}/pkg-publish

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        package: [full, reader]
    steps:
      # Pinned by commit: this job holds a token that publishes as the owner.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-${{ matrix.package }}
          path: pkg

      - run: npm publish ./pkg --provenance
