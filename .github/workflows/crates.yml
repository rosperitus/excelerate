name: crates.io

# A tag vX.Y.Z publishes the crate. Publishing goes through crates.io trusted
# publishing (OIDC): no token in the repository, but the crate's settings on
# crates.io have to name this repository and this workflow file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Pinned by commit: this job holds a token that publishes as the owner.
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - run: rustup toolchain install stable --profile minimal

      - name: The tag matches the crate version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "excelerate") | .version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, crate $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A rerun after the crate went out must not fail on the version already there.
      - name: Already published?
        id: known
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -A 'excelerate-ci (github.com/rosperitus/excelerate)' \
            "https://crates.io/api/v1/crates/excelerate/${{ steps.version.outputs.version }}")
          echo "published=$([ "$code" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.known.outputs.published == 'false'
        id: auth

      - if: steps.known.outputs.published == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
