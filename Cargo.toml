[package]
name = "excelerate"
version = "0.10.0"
edition = "2024"
description = "Read, write and recalculate spreadsheets: xlsx, xls, ods, csv, html, and a 518-function formula engine"
license = "MIT"
repository = "https://github.com/rosperitus/excelerate"
homepage = "https://github.com/rosperitus/excelerate"
documentation = "https://docs.rs/excelerate"
readme = "README.md"
keywords = ["xlsx", "spreadsheet", "excel", "ods", "formula"]
categories = ["parser-implementations", "encoding", "wasm"]
# The npm packages are built from this crate but are not part of it, and the
# oracle is a Go module used to check our answers against another engine.
exclude = ["npm/", "npm-reader/", "tools/", ".github/"]

[features]
default = ["formulas", "write"]
# The formula engine: parser, evaluator and the builtins. The bulk of the
# crate by volume, and what a reader-only build drops first.
formulas = ["dep:regex"]
# Writing files back out, in every format that has a writer.
write = []

[dependencies]
# Already in the tree under `zip`; naming it here is what lets the Gnumeric
# reader gunzip its one XML part.
flate2 = "1.1.9"
# Both already in the tree under `zip`: the password hash of a protected
# sheet or workbook (SHA-512, SHA-1 for older files) and its random salt.
getrandom = "0.4"
quick-xml = "0.42.0"
# `REGEXTEST`, `REGEXEXTRACT`, `REGEXREPLACE`: a pattern engine is not twenty
# lines. Without lookaround or backreferences, which Excel's PCRE2 has. The
# speed-ups and the Unicode tables beyond `\w`, `\d`, `\s` and case are left
# out: with them the wasm grew by 1.1 MB.
regex = { version = "1", optional = true, default-features = false, features = [
    "std",
    "unicode-case",
    "unicode-perl",
] }
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2.0.20"
zip = "8.6.0"

# The wasm bindings only; a native build never sees this.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# `Date.now()`: wasm32-unknown-unknown has no clock of its own.
js-sys = "0.3"
# `crypto.getRandomValues` for the salt of a new password hash.
getrandom = { version = "0.4", features = ["wasm_js"] }

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
